<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2A170A">
<title>Shero Baba: Lion Run</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-coin" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#B45309"/><circle cx="16" cy="15" r="13" fill="#FBBF24" stroke="#3A2111" stroke-width="2"/><circle cx="16" cy="15" r="9" fill="none" stroke="#D97706" stroke-width="2"/><path d="M16 8.5l2 4.2 4.6.6-3.4 3.1.9 4.6-4.1-2.3-4.1 2.3.9-4.6-3.4-3.1 4.6-.6z" fill="#FFF7D6" stroke="#B45309" stroke-width="1"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a7 7 0 0 0-1.7-1L15 3.3h-4L10.7 6a7 7 0 0 0-1.7 1l-2.5-1-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a7 7 0 0 0 1.7 1l.3 2.7h4l.3-2.7a7 7 0 0 0 1.7-1l2.5 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><path d="M15 5 9 3 3 5v16l6-2 6 2 6-2V3zm0 13.8-6-2V5.2l6 2z"/></symbol>
  <symbol id="i-tool" viewBox="0 0 24 24"><path d="M22.7 19 13.6 9.9a6 6 0 0 0-7.8-7.8l3.9 3.9-2.8 2.8-3.9-3.9a6 6 0 0 0 7.8 7.8l9.1 9.1a1 1 0 0 0 1.4 0l1.4-1.4a1 1 0 0 0 0-1.4z"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 2h2v20H5zM8 3h11l-2.5 4.5L19 12H8z"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M18 3V2H6v1H2v4a4 4 0 0 0 4 4h.4A6 6 0 0 0 11 14.9V18H7v4h10v-4h-4v-3.1a6 6 0 0 0 4.6-3.9h.4a4 4 0 0 0 4-4V3zM4 7V5h2v4a2 2 0 0 1-2-2zm16 0a2 2 0 0 1-2 2V5h2z"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></symbol>
</svg>

<div id="app">
  <canvas id="game"></canvas>

  <!-- LOADING -->
  <section class="screen bg-warm on" id="s-load">
    <div class="offline"><i></i><span class="t" data-t="offline">Plays offline</span></div>
    <div>
      <div class="portrait" id="loadPortrait"></div>
      <div class="logo"><b>SHERO BABA</b><span class="t" data-t="tagline">Lion Run</span></div>
    </div>
    <div class="loadbox">
      <div class="bar"><i id="loadBar" style="width:0"></i></div>
      <div class="tip t" id="loadTip"></div>
    </div>
  </section>

  <!-- HOME -->
  <section class="screen bg-warm" id="s-home">
    <div class="topbar">
      <span class="pill rank"><svg class="ico" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="#FBBF24" stroke="#3A2111" stroke-width="2"/><text x="16" y="21" text-anchor="middle" font-family="Lilita One" font-weight="900" font-size="14" fill="#3A2111" id="rankNum">1</text></svg><span class="t" data-t="rank">Rank</span></span>
      <h2></h2>
      <span class="pill"><svg class="ico"><use href="#i-coin"/></svg><span class="coinsVal num">0</span></span>
      <button class="iconbtn" data-act="settings" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
    </div>
    <div class="truckart"></div>
    <svg class="skyline" viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <path fill="#7C2D12" d="M0 300V190h30v-30h10v30h20v-50l6-14 6 14v50h24v-40a30 30 0 0 1 60 0v40h14V120l5-30 5 30v70h20v-60c0-20 30-20 30 0v60h24v-30h40v30h14V150l6-14 6 14v40h30v-20h20v130z"/>
      <path fill="#431407" d="M0 300v-60h50v-20h40v20h50v-30l20-20 20 20v30h60v-24h50v24h60v-16h50v76z"/>
    </svg>
    <div class="homebody">
      <div class="portrait" id="homePortrait"></div>
      <div class="logo"><b>SHERO BABA</b><span class="t" data-t="tagline">Lion Run</span></div>
      <div class="statline">
        <span class="chip"><span class="t" data-t="best">Best</span> <b class="num" id="homeBest">0</b></span>
        <span class="chip"><span class="t" data-t="stars">Stars</span> <b class="num" id="homeStars">0</b></span>
      </div>
      <div class="cta">
        <button class="btn go" data-act="endless"><svg><use href="#i-play"/></svg><span class="t" data-t="endless">Endless run</span></button>
        <button class="btn gold" data-act="nav" data-to="map"><svg><use href="#i-map"/></svg><span class="t" data-t="story">Story map</span></button>
      </div>
    </div>
  </section>

  <!-- MAP -->
  <section class="screen" id="s-map" style="background:#84CC16">
    <div class="topbar">
      <span class="pill"><svg class="ico"><use href="#i-coin"/></svg><span class="coinsVal num">0</span></span>
      <h2 class="t" data-t="mapTitle">Pakistan Map</h2>
      <button class="iconbtn" data-act="settings" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
    </div>
    <div class="truckart"></div>
    <div id="mapwrap"><svg id="mapsvg"></svg></div>
    <div class="levelsheet panel" id="levelSheet">
      <div class="row">
        <div class="badge" id="lvIcon"></div>
        <div style="flex:1;min-width:0">
          <h4 style="margin:0;font:900 19px var(--display);color:var(--umber)" id="lvName"></h4>
          <p style="margin:2px 0 0;font:700 13px var(--body);color:var(--terra)" id="lvGoal"></p>
        </div>
        <div class="stars" id="lvStars"></div>
      </div>
      <p class="tiny" id="lvStarRules" style="margin:8px 0 10px"></p>
      <button class="btn go" data-act="startLevel"><svg><use href="#i-play"/></svg><span class="t" data-t="startRun">Start run</span></button>
    </div>
  </section>

  <!-- WORKSHOP -->
  <section class="screen bg-wood" id="s-shop">
    <div class="topbar">
      <span class="pill"><svg class="ico"><use href="#i-coin"/></svg><span class="coinsVal num">0</span></span>
      <h2 class="t" data-t="workshop">Shero's Workshop</h2>
      <button class="iconbtn" data-act="settings" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
    </div>
    <div class="truckart"></div>
    <div class="scroll">
      <div class="stage"><div class="plinth"></div><canvas id="stageCv" width="380" height="380"></canvas></div>
      <div class="tabs">
        <button class="cur" data-act="shopTab" data-tab="up"><span class="t" data-t="upgrades">Upgrades</span></button>
        <button data-act="shopTab" data-tab="fit"><span class="t" data-t="outfits">Outfits</span></button>
      </div>
      <div id="shopList"></div>
    </div>
  </section>

  <!-- MISSIONS -->
  <section class="screen bg-parch" id="s-missions">
    <div class="topbar">
      <span class="pill"><svg class="ico"><use href="#i-coin"/></svg><span class="coinsVal num">0</span></span>
      <h2 class="t" data-t="missions">Missions</h2>
      <button class="iconbtn" data-act="settings" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
    </div>
    <div class="truckart"></div>
    <div class="scroll" id="missionList"></div>
  </section>

  <!-- RECORDS -->
  <section class="screen bg-parch" id="s-records">
    <div class="topbar">
      <span class="pill"><svg class="ico"><use href="#i-coin"/></svg><span class="coinsVal num">0</span></span>
      <h2 class="t" data-t="records">Records</h2>
      <button class="iconbtn" data-act="settings" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
    </div>
    <div class="truckart"></div>
    <div class="scroll" id="recordList"></div>
  </section>

  <!-- HUD -->
  <div id="hud">
    <div class="top">
      <div class="col">
        <span class="pill" style="padding-left:12px"><span class="num" id="hScore">0</span><span class="x2" id="hX2" style="display:none">x2</span></span>
        <span class="pill"><svg class="ico"><use href="#i-coin"/></svg><span class="num" id="hCoins">0</span></span>
      </div>
      <div class="progress"><span id="hDist" class="num">0 m</span><div class="bar" id="hBarWrap"><i id="hBar" style="width:0"></i></div></div>
      <button class="iconbtn dark" id="pauseBtn" data-act="pause" aria-label="Pause"><svg><use href="#i-pause"/></svg></button>
    </div>
    <div id="powers"></div>
    <div id="pad">
      <span></span><button data-key="up" aria-label="Jump">▲</button><span></span>
      <button data-key="left" aria-label="Left">◀</button><button data-key="down" aria-label="Slide">▼</button><button data-key="right" aria-label="Right">▶</button>
    </div>
    <button id="roarBtn" data-act="roar" aria-label="Roar"><span class="t" data-t="roar">ROAR</span></button>
  </div>
  <div id="toast"></div>
  <div id="hint" class="t"></div>
  <div id="count"></div>

  <nav id="nav">
    <button data-act="nav" data-to="home"><svg><use href="#i-home"/></svg><span class="t" data-t="home">Home</span></button>
    <button data-act="nav" data-to="map"><svg><use href="#i-map"/></svg><span class="t" data-t="map">Map</span></button>
    <button data-act="nav" data-to="shop"><svg><use href="#i-tool"/></svg><span class="t" data-t="shop">Workshop</span></button>
    <button data-act="nav" data-to="missions"><svg><use href="#i-flag"/></svg><span class="t" data-t="missionsTab">Missions</span><i class="dot" id="missionDot"></i></button>
    <button data-act="nav" data-to="records"><svg><use href="#i-trophy"/></svg><span class="t" data-t="recordsTab">Records</span></button>
  </nav>

  <!-- SETTINGS / PAUSE -->
  <div class="modal" id="m-settings">
    <div style="width:100%;max-width:380px">
      <div class="ribbon" id="setTitle"></div>
      <div class="panel">
        <div class="opt" id="pauseInfo" style="display:none"><span id="pauseLoc"></span><span class="num" id="pauseScore"></span></div>
        <div class="opt"><span class="t" data-t="music">Music</span><button class="toggle" data-act="toggle" data-key="music" aria-label="Music"></button></div>
        <div class="opt"><span class="t" data-t="sfx">Sound effects</span><button class="toggle" data-act="toggle" data-key="sfx" aria-label="Sound effects"></button></div>
        <div class="opt"><span class="t" data-t="vibe">Vibration</span><button class="toggle" data-act="toggle" data-key="vibe" aria-label="Vibration"></button></div>
        <div class="opt"><span class="t" data-t="pad">On-screen buttons</span><button class="toggle" data-act="toggle" data-key="pad" aria-label="On-screen buttons"></button></div>
        <div class="opt"><span class="t" data-t="lang">Language</span><div class="seglang"><button data-act="lang" data-lang="en">EN</button><button data-act="lang" data-lang="ur">اردو</button></div></div>
        <div class="stack" id="setBtns"></div>
      </div>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="modal" id="m-results">
    <div style="width:100%;max-width:380px">
      <div class="ribbon" id="resTitle"></div>
      <div class="panel" style="text-align:center">
        <div class="stars" id="resStars" style="font-size:38px;margin-top:4px"></div>
        <div id="resBest"></div>
        <div class="statgrid">
          <div class="stat"><b class="num" id="resScore">0</b><span class="t" data-t="score">Score</span></div>
          <div class="stat"><b class="num" id="resDist">0</b><span class="t" data-t="distance">Distance</span></div>
          <div class="stat"><b class="num" id="resCoins">0</b><span class="t" data-t="coinsGot">Coins collected</span></div>
          <div class="stat"><b class="num" id="resXp">0</b><span class="t" data-t="xp">Rank XP</span></div>
        </div>
        <p class="tiny" id="resMsg"></p>
        <div class="stack" id="resBtns"></div>
      </div>
    </div>
  </div>

  <!-- REVIVE -->
  <div class="modal" id="m-revive">
    <div style="width:100%;max-width:340px">
      <div class="ribbon red t" data-t="crashed">Ouch!</div>
      <div class="panel" style="text-align:center">
        <div style="font:900 60px var(--display);color:var(--chilli)" id="reviveCount">5</div>
        <p class="t" data-t="reviveQ" style="font:700 15px var(--body);margin:0 0 12px">Keep running from here?</p>
        <div class="stack">
          <button class="btn go" data-act="revive" id="reviveBtn"><span class="t" data-t="continue">Continue</span> <span class="coinlabel"><svg class="ico" style="width:24px;height:24px"><use href="#i-coin"/></svg><span id="reviveCost">150</span></span></button>
          <button class="btn wood small" style="width:100%" data-act="noRevive"><span class="t" data-t="endRun">End run</span></button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
