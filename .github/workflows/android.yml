name: Build Android (APK + AAB)

on:
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    tags: ['v*']            # pushing a tag like v1.0.1 also creates a GitHub Release

permissions:
  contents: write           # needed to attach files to a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Use the runner's Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: npm ci

      - name: Version name from tag or package.json
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          fi

      - name: Generate Android project
        run: bash scripts/prepare-android.sh

      - name: Decode upload keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK + AAB
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Build debug APK (no keystore secrets yet)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: |
          echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set. Building a DEBUG APK only (not uploadable to Play). See docs/KEYS_AND_SIGNING.md"
          ./gradlew --no-daemon assembleDebug

      - name: Verify signature and collect files
        run: |
          mkdir -p dist
          NAME="SheroBaba-${VERSION_NAME}-${VERSION_CODE}"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ "$HAS_KEYSTORE" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist/$NAME.apk"
            cp android/app/build/outputs/bundle/release/app-release.aab "dist/$NAME.aab"
            "$BT/apksigner" verify --print-certs "dist/$NAME.apk" | head -5
            jarsigner -verify "dist/$NAME.aab" | tail -1
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "dist/$NAME-debug.apk"
          fi
          ls -lh dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shero-baba-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: dist/*
          retention-days: 30

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

      # Optional: send the AAB straight to Play Console (internal testing, as a draft).
      # Works only AFTER you have uploaded the first AAB by hand. See docs/KEYS_AND_SIGNING.md
      - name: Upload AAB to Google Play (internal track)
        if: env.HAS_PLAY == 'true' && env.HAS_KEYSTORE == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sherobaba.runner
          releaseFiles: dist/*.aab
          track: internal
          status: draft
